# Minimal prompt configuration. Keep it readable first; add symbols/noise only
# when they carry useful signal.

add_newline = false

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = "[$symbol$branch]($style) "

[git_status]
format = "([$all_status$ahead_behind]($style) )"

[cmd_duration]
min_time = 1000
format = "took [$duration]($style) "
