# Clipboard behavior is explicit so browser-to-terminal copy/paste works the
# same way across GNOME now and Hyprland later.

[terminal]
osc52 = "CopyPaste"

[keyboard]
bindings = [
  { key = "C", mods = "Control|Shift", action = "Copy" },
  { key = "V", mods = "Control|Shift", action = "Paste" },
]
